<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certified Kubernetes Administrator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8f9fa;
      color: #333;
      text-align: center;
      padding: 60px 20px;
    }

    h1 {
      color: #0066cc;
    }

    img {
      display: block;
      margin: 40px auto 30px auto;
      max-width: 800px;
      width: 100%;
      height: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      border-radius: 6px;
    }

    .verify-box {
      margin-top: 20px;
      padding: 20px;
      display: inline-block;
      background: white;
      border-radius: 8px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.08);
      font-size: 1rem;
    }

    .verify-id {
      font-weight: bold;
      font-size: 1.1rem;
      color: #0066cc;
      margin-top: 8px;
    }

    .verify-link {
      margin-top: 10px;
      display: block;
    }
  </style>
</head>

<body>

  <img src="assets/images/CKA.png" alt="Certified Kubernetes Administrator Certificate">

  <div class="verify-box">
    <div>This certificate can be verified at:</div>
    <a class="verify-link" href="https://training.linuxfoundation.org/certification/verify/" target="_blank">
      https://training.linuxfoundation.org/certification/verify/
    </a>
    <div class="verify-id">Verification ID: LF-m4f7ji9qqo</div>
  </div>

</body>
</html>
